<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="arena">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>SkillClash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Inter:wght@400;500;600;700&display=swap" />
    <meta name="theme-color" content="#07080a" />
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>
      html { background-color: #07080a; color-scheme: dark; }
      /* Add one line per theme you create, mirroring its --color-background. */
      /* Reload splash: shown until React puts anything in #root, never again in-app. */
      #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07080a;color:#fff;font:italic 800 2rem 'Barlow Condensed','Arial Narrow',system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
      #splash b{color:#c8ff2e;font-weight:inherit}
      #root:not(:empty)~#splash{display:none}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">Skill<b>Clash</b></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
